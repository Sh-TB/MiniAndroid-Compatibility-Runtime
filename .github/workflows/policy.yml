name: policy

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: policy validator (CONSTITUTION_V2 §172.5 + S213/S214)
        run: python tools/policy_validator.py check
      - name: validator law test (positive + 8 negative classes)
        run: python tests/policy_validator_law_test.py
      - name: hygiene checker self-test
        run: python tools/test_check_repo_hygiene.py
